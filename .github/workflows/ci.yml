name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests run inside the image (the Dockerfile's web-test and test stages), so they see exactly what ships.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Frontend tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Backend tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
