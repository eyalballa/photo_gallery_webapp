[project]
name = "wall"
version = "0.1.0"
description = "Birthday photo wall backend"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "resvg-py>=0.5.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
